
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ivy Tech Kiosk Simulator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #181818;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        header {
            height: 60px;
            background: #252525;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        button {
            background: #006648;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #preview {
            width: 100vw;
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        #frameContainer {
            position: relative;
            flex-shrink: 0;
            background: black;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1920px;
            border: none;
            transform-origin: top left;
        }
    </style>
</head>

<body>

    <header>
        <div>
            <strong>Ivy Tech Kiosk Simulator</strong>
            | 1080 x 1920 | Portrait
        </div>

        <div>
            <button onclick="resizeKiosk()">Fit Screen</button>
            <button onclick="setScale(0.25)">25%</button>
            <button onclick="setScale(0.50)">50%</button>
            <button onclick="setScale(1)">100%</button>
            <button onclick="reloadKiosk()">Reload</button>
        </div>
    </header>

    <main id="preview">
        <div id="frameContainer">
            <iframe
                id="kiosk"
                src="./Kisok/"
                title="Ivy Tech Kiosk"
                allow="autoplay; fullscreen">
            </iframe>
        </div>
    </main>
<script>
    /* =========================================================
       KIOSK SIMULATOR CONFIGURATION
       ========================================================= */

    const kiosk = document.getElementById("kiosk");
    const preview = document.getElementById("preview");
    const container = document.getElementById("frameContainer");

    const WIDTH = 1080;
    const HEIGHT = 1920;
    const PREVIEW_PADDING = 24;

    let fitMode = true;

    /* =========================================================
       DISPLAY SCALING
       ========================================================= */

    function applyScale(scale) {
        const scaledWidth = WIDTH * scale;
        const scaledHeight = HEIGHT * scale;

        container.style.width = `${scaledWidth}px`;
        container.style.height = `${scaledHeight}px`;

        kiosk.style.transform = `scale(${scale})`;

        preview.style.alignItems =
            scaledHeight > preview.clientHeight
                ? "flex-start" : "center";

        preview.style.justifyContent =
            scaledWidth > preview.clientWidth
                ? "flex-start" : "center";
    }

    // Apply a manually selected zoom level
    function setScale(scale) {
        fitMode = false;
        applyScale(scale);
    }

    // Automatically fit the kiosk within the browser
    function resizeKiosk() {
        fitMode = true;

        const scale = Math.max(0.01, Math.min(
            (preview.clientWidth - PREVIEW_PADDING) / WIDTH,
            (preview.clientHeight - PREVIEW_PADDING) / HEIGHT,
            1
        ));

        applyScale(scale);
    }

    /* =========================================================
       RELOAD AND WINDOW EVENTS
       ========================================================= */

    function reloadKiosk() {
        kiosk.src = `./Kisok/?t=${Date.now()}`;
    }

    window.addEventListener("resize", () => {
        if (fitMode) {
            resizeKiosk();
        }
    });

    // Initialize the simulator
    resizeKiosk();
</script>

</body>
</html>
